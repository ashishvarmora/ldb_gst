name: Tracking sweep

# Vercel's Hobby plan only allows ONE cron run per day, which is not enough for
# a tracker. This workflow calls the same endpoint every 5 minutes instead, for
# free. vercel.json keeps a daily run as a backstop.
#
# Two repository secrets are required
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   APP_URL      https://your-project.vercel.app     (no trailing slash)
#   CRON_SECRET  the same value as in Vercel's env vars
#
# Note: GitHub's scheduler is best-effort - a run can be delayed by several
# minutes when the platform is busy, and scheduled workflows are switched off
# automatically after 60 days with no commits to the repo. If you need it exact,
# use cron-job.org instead (see docs/TRACKING-WORKER.md).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  # Never let a slow sweep overlap with the next one.
  group: tracking-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the tracking worker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets are not set."
            exit 1
          fi

          response=$(curl -sS --max-time 300 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/track")

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Tracking sweep failed with HTTP $status"
            exit 1
          fi

          # Surface the numbers in the run summary so a glance at the Actions
          # tab tells you whether tracking is actually working.
          {
            echo "### Tracking sweep"
            echo ""
            echo '```json'
            echo "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
