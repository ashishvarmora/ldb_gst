<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>No connection</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f4f6fa; color: #0f172a;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    main { max-width: 340px; text-align: center; }
    h1 { font-size: 20px; margin: 16px 0 6px; }
    p { margin: 0 0 20px; color: #475569; font-size: 15px; }
    button {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 22px;
      background: #2563eb; color: #fff; font: inherit; font-weight: 600;
    }
    svg { color: #64748b; }
  </style>
</head>
<body>
  <main>
    <img src="rahdari-logo.webp" alt="Rahdari" width="176" height="90" style="display:block;margin:0 auto 24px;object-fit:contain" />
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/>
    </svg>
    <h1>You're offline</h1>
    <p>Rahdari needs the internet to look up trucks. Check your signal or Wi-Fi and try again.</p>
    <button type="button" onclick="location.href='https://rahdari.in/portal'">Try again</button>
  </main>
  <script>
    // Come back by itself the moment the phone is online again.
    window.addEventListener("online", function () { location.href = "https://rahdari.in/portal"; });
  </script>
</body>
</html>
